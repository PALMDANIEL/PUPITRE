# Fabrique les installateurs de Pupitre : Windows (.exe), Mac Intel et Mac Apple Silicon (.dmg).
# - à chaque envoi sur main, ou à la main (Actions › Installateurs › Run workflow) : fichiers dans « Artifacts » ;
# - en publiant une version : git tag v1.0.0 && git push origin v1.0.0 → Release GitHub avec les installateurs.
name: Installateurs

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

env:
  AUDIVERIS_VERSION: '5.11.0'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            builder: --win --x64
            file: Windows
          - os: macos-15-intel
            name: mac-intel
            builder: --mac --x64
            audiveris: macosx-x86_64
            file: Mac-Intel
          - os: macos-latest
            name: mac-apple-silicon
            builder: --mac --arm64
            audiveris: macosx-arm64
            file: Mac-Apple-Silicon-M1-M2-M3-M4
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            engine/requirements.txt
            engine/requirements-chant.txt

      - name: Version depuis l'étiquette
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: cd desktop && npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Interface (Angular)
        run: |
          npm ci
          npx ng build

      - name: Moteur autonome (PyInstaller)
        shell: bash
        run: |
          # --no-deps : la liste est complète ; on évite PyAudio (dépendance de tinysoundfont pour la lecture en direct, inutile ici)
          .github/scripts/journal.sh "Dépendances Python" python -m pip install --no-deps -r engine/requirements.txt
          .github/scripts/journal.sh "Voix chantées" python -m pip install --no-deps -r engine/requirements-chant.txt
          .github/scripts/journal.sh "PyInstaller" python -m pip install pyinstaller==6.22.3
          .github/scripts/journal.sh "Moteur" pyinstaller --noconfirm --distpath engine/dist --workpath engine/build engine/pupitre-engine.spec

      - name: Audiveris (Mac)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL -o audiveris.dmg "https://github.com/Audiveris/audiveris/releases/download/${AUDIVERIS_VERSION}/Audiveris-${AUDIVERIS_VERSION}-${{ matrix.audiveris }}.dmg"
          # l'image affiche l'accord de licence d'Audiveris (AGPL) : réponse automatique, sinon l'ouverture attend indéfiniment
          yes | hdiutil attach audiveris.dmg -nobrowse -noautoopen -mountpoint /Volumes/audiveris > /dev/null
          mkdir -p desktop/vendor/audiveris
          ditto /Volumes/audiveris/Audiveris.app desktop/vendor/audiveris/Audiveris.app
          hdiutil detach /Volumes/audiveris

      - name: Audiveris (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/Audiveris/audiveris/releases/download/$env:AUDIVERIS_VERSION/Audiveris-$env:AUDIVERIS_VERSION-windowsConsole-x86_64.msi"
          Invoke-WebRequest -Uri $url -OutFile audiveris.msi
          $target = Join-Path $PWD 'desktop\vendor\audiveris'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Start-Process msiexec.exe -Wait -ArgumentList '/a', 'audiveris.msi', '/qn', "TARGETDIR=$target"
          Get-ChildItem -Recurse -Filter 'Audiveris*.exe' $target | Select-Object -First 3 FullName

      - name: Installateur
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          cd desktop
          npm ci
          ../.github/scripts/journal.sh "Assemblage" npm run vendor
          npx node build.mjs
          ../.github/scripts/journal.sh "electron-builder" npx electron-builder ${{ matrix.builder }} --publish never '-c.artifactName=Pupitre-${version}-${{ matrix.file }}.${ext}'

      - uses: actions/upload-artifact@v4
        with:
          name: Pupitre-${{ matrix.name }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installateurs
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Pupitre ${{ github.ref_name }}
          files: installateurs/*
          body: |
            Installateurs de Pupitre ${{ github.ref_name }} (AIT – Artificial Intelligence & Technology).

            **Quel fichier choisir ?**
            - PC **Windows** : `Pupitre-…-Windows.exe`
            - **Mac** : menu Apple  › *À propos de ce Mac*.
              - « Processeur … Intel » → `Pupitre-…-Mac-Intel.dmg`
              - « Puce Apple M1, M2, M3 ou M4 » → `Pupitre-…-Mac-Apple-Silicon-M1-M2-M3-M4.dmg`
                (la version Intel fonctionne aussi sur ces Mac, un peu plus lentement)
            - Téléphone **Android** (choristes) : `Pupitre-…-android….apk` (autoriser « applications inconnues »)
            - **iPhone** : `Pupitre-…-iOS-non-signe.ipa`, à installer avec **AltStore** ou **Sideloadly** et un identifiant Apple
              (gratuit, à renouveler tous les 7 jours) en attendant la publication sur l'App Store

            Téléphone : *Mes chants › Réglages du serveur de lecture* → adresse `https://pupitre-lecture.vercel.app`
            et code d'accès de la chorale, pour photographier une partition.

            Une licence AIT est nécessaire au premier lancement de la version ordinateur.
            L'ordinateur vérifie sa licence auprès d'AIT quand il a Internet ; il doit se connecter au moins une fois tous les 30 jours.
            Sonorités : Chœur synthé, Chœur réel (« aah », « ouh »), Piano, Voix chantées (paroles, essai). Les voix chantées se téléchargent une seule fois au premier usage (environ 220 Mo, Internet nécessaire ce jour-là).
            Mac : au premier lancement, si macOS refuse d'ouvrir Pupitre, *Réglages Système › Confidentialité et sécurité › Ouvrir quand même*.
            Windows : « Windows a protégé votre ordinateur » › *Informations complémentaires* › *Exécuter quand même*.
